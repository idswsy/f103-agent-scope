name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ══════════════════════════════════════════════════════════════
  # C 端协议测试 —— 保证固件侧的编解码与黄金向量一致
  # ══════════════════════════════════════════════════════════════
  proto-c:
    name: C 协议向量测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 重新生成黄金向量并比对
        run: |
          python3 proto/tests/gen_vectors.py > /tmp/vectors_regen.json
          if ! diff -q /tmp/vectors_regen.json proto/tests/vectors.json >/dev/null; then
            echo "::error::vectors.json 与 gen_vectors.py 不同步！"
            echo "本地跑：./proto/run_tests.sh --regen  然后提交"
            diff /tmp/vectors_regen.json proto/tests/vectors.json | head -40
            exit 1
          fi
          echo "✓ 黄金向量与生成脚本一致"

      - name: 编译并运行 C 端测试
        run: make -C proto test

      # 协议真相源的四处同步检查 —— 这是本项目的核心纪律
      - name: 检查协议四处同步
        run: |
          echo "协议契约的四个位置："
          echo "  1. docs/03-protocol.md"
          echo "  2. proto/protocol.h"
          echo "  3. host/crates/proto/src/lib.rs"
          echo "  4. proto/tests/vectors.json"

          # 版本号必须一致
          md_ver=$(grep -oP 'VER_MAJOR:?\s*[:=]?\s*\K\d+' proto/protocol.h | head -1)
          rs_ver=$(grep -oP 'VER_MAJOR: u8 = \K\d+' host/crates/proto/src/lib.rs | head -1)
          json_ver=$(python3 -c "import json;print(json.load(open('proto/tests/vectors.json'))['proto_ver'] >> 4)")

          echo "proto.h=$md_ver lib.rs=$rs_ver vectors.json=$json_ver"
          if [ "$md_ver" != "$rs_ver" ] || [ "$md_ver" != "$json_ver" ]; then
            echo "::error::协议主版本号三处不一致"
            exit 1
          fi

  # ══════════════════════════════════════════════════════════════
  # Rust 上位机
  # ══════════════════════════════════════════════════════════════
  host-rust:
    name: Rust 上位机测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: host

      # 串口 crate 在 Linux 上需要 libudev
      - name: 安装系统依赖
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: 格式检查
        run: cargo fmt --all -- --check

      # GUI（scope-gui）单独一个 job：它拉 eframe/winit，Ubuntu 上要额外的
      # 图形系统库，而且编译量大。排除它能让这个 job 保持快且稳。
      - name: Clippy
        run: cargo clippy --workspace --exclude scope-gui --all-targets -- -D warnings

      - name: 测试（含黄金向量的跨语言一致性检查）
        run: cargo test --workspace --exclude scope-gui

  # ══════════════════════════════════════════════════════════════
  # 桌面 GUI —— 单独一个 job，因为它要一整套图形系统库
  # ══════════════════════════════════════════════════════════════
  gui:
    name: GUI 桌面上位机
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: host

      # eframe 官方给出的 Linux 依赖，加上串口要的 libudev。
      #
      # `gcc` 是给 **ring** 装的：AI 分析面板引入的 ureq 走 rustls，
      # 而 rustls 在 Linux 上默认用 ring 做密码学后端 —— ring 里有一段 C 和
      # 汇编，`cc` crate 需要一个真正的 C 编译器才编得过。
      # 运行器上通常自带 gcc，但**不假设**它一定在（本文件里
      # firmware-layering 那个 job 就是这么做的，理由相同）。
      - name: 安装图形系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config gcc \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev

      - name: Clippy
        run: cargo clippy -p scope-gui --all-targets -- -D warnings

      # 只跑单元测试，**不启动窗口** —— CI 是无头机，没有 DISPLAY，
      # 任何 run_native 调用都会失败。视图模型的单测是纯函数，不需要 GUI。
      - name: 视图模型单测（无头）
        run: cargo test -p scope-gui

  # ══════════════════════════════════════════════════════════════
  # 架构纪律 —— ADR-008：App/ 层不许依赖 HAL
  # ══════════════════════════════════════════════════════════════
  firmware-layering:
    name: 固件分层纪律检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: App/ 层不得包含 HAL / 寄存器头文件
        run: |
          # ADR-008：App/ 必须能在 PC 上用 gcc 编译测试，
          # 所以不许直接碰 HAL。破坏了这条，三个人就都得等板子。
          if grep -rn --include='*.c' --include='*.h' \
               -E '#include\s*[<"](stm32[a-z0-9]*|hal_[a-z]*|gd32[a-z0-9]*|HAL)\.?h?[>"]' \
               firmware/App/ 2>/dev/null; then
            echo "::error::firmware/App/ 出现了对 HAL/寄存器的直接依赖（违反 ADR-008）"
            echo "硬件访问必须经 firmware/Hardware/ 的抽象接口"
            exit 1
          fi
          echo "✓ App/ 层保持硬件无关"

      # 上一条只是 grep 兜底；**这一条才是真正的验收** ——
      # 真把 App/ 编译一遍。App/ 一旦真的依赖了 HAL，include 路径里
      # 没有那些头，这里直接编译不过。比 grep 可靠：grep 挡不住
      # 间接依赖、宏、或者换个写法的 include。
      - name: 在 PC 上编译并运行 App/ 的测试
        run: |
          sudo apt-get update && sudo apt-get install -y gcc
          ./firmware/run_tests.sh

      # 上面那条是「App/ 不许碰 HAL」的验收；这一条是它的**反面** ——
      # Hardware/ 与 Core/ 本来就该碰 HAL，所以要带着 HAL 包含路径编一遍。
      #
      # 为什么必需：`Hardware/src/scope_ui.c`（上游那套本机显示+按键逻辑）
      # 在 `SCOPE_LOCAL_UI=0` 时**整个文件被 `#if` 关掉、不参与 Keil 构建**，
      # 所以它不会因为编译失败而被人发现 —— 会一直烂到 P4 要用的时候。
      # 这里两种开关都编一遍，它就没有腐烂的机会。
      #
      # `-w` 关掉警告：宿主是 64 位而目标是 ARM，CMSIS 里
      # `(uint32_t *)SCB->VTOR` 这类 `-Wint-to-pointer-cast` 是**必然**的，
      # 与本工程无关。只看**退出码**，只有真错误才算失败。
      - name: 硬件层语法检查（含默认关闭的本机 UI）
        run: |
          INC="-Ifirmware/Core/Inc -Ifirmware/Drivers/STM32F1xx_HAL_Driver/Inc"
          INC="$INC -Ifirmware/Drivers/STM32F1xx_HAL_Driver/Inc/Legacy"
          INC="$INC -Ifirmware/Drivers/CMSIS/Device/ST/STM32F1xx/Include"
          INC="$INC -Ifirmware/Drivers/CMSIS/Include -Ifirmware/Hardware/inc"
          DEF="-DUSE_HAL_DRIVER -DSTM32F103xB"
          fail=0
          for ui in 0 1; do
            for f in firmware/Core/Src/*.c firmware/Hardware/src/*.c; do
              if ! gcc -fsyntax-only -w -std=c11 $DEF -DSCOPE_LOCAL_UI=$ui $INC "$f"; then
                echo "::error file=$f::语法检查失败（SCOPE_LOCAL_UI=$ui）"
                fail=1
              fi
            done
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "✓ 硬件层在 SCOPE_LOCAL_UI=0 与 =1 两种开关下都编得过"

      # ⚠ 这个坑是**静默**的，必须由 CI 兜住。
      #
      # 在 Windows 上提交脚本时，git 默认不跟踪可执行位（core.fileMode=false），
      # 文件会以 100644 入库。本地跑 `./xxx.sh` 照样能跑（Windows 不看那个位），
      # **只有在 Linux runner 上才炸**：`Permission denied`。
      #
      # 回归：`firmware/run_tests.sh` 就是这么进来的 —— CI 从加入它的那次合并
      # 起连红三轮（240006d / 37c44a8 / b39b8c0），而本地完全复现不出来。
      - name: 检查 CI 调用的脚本有可执行位
        run: |
          # 查的是 **git 索引里的模式**，不是文件系统上的 `-x`。
          # 两头都重要：Windows 的 Git Bash 会把所有文件都报成可执行，
          # 用 `[ -x ]` 在本地既能通过、又说明不了 runner 上会怎样。
          # 索引里的 100755 / 100644 在两端是同一个值 —— 所以这条
          # **本地就能验**，包括故意改回 100644 看它会不会红。
          missing=0
          for s in $(grep -oP '^\s*\./\K\S+\.sh' .github/workflows/ci.yml | sort -u); do
            mode=$(git ls-files -s -- "$s" | awk '{print $1}')
            if [ "$mode" != "100755" ]; then
              echo "::error file=$s::CI 用 ./ 调用 $s，但它在 git 里是 ${mode:-（未跟踪）}，不是 100755"
              echo "  在 Linux runner 上会 Permission denied。修：git update-index --chmod=+x $s"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "✓ CI 调用的脚本都有可执行位"

      - name: 检查关键文档存在
        run: |
          for f in docs/03-protocol.md docs/04-performance.md proto/tests/vectors.json; do
            [ -f "$f" ] || { echo "::error::缺少 $f"; exit 1; }
          done
          echo "✓ 关键文档齐全"

  # ══════════════════════════════════════════════════════════════
  # 端到端冒烟 —— 对着模拟器跑一次完整采集
  # ══════════════════════════════════════════════════════════════
  e2e-smoke:
    name: 端到端冒烟（模拟器）
    runs-on: ubuntu-latest
    needs: [host-rust]
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: 采集一次并检查输出
        run: |
          cargo run -q -p scope-cli -- sim capture --scenario sine_1k_3v3 -n 1024 -o /tmp/wave.csv
          test -s /tmp/wave.csv || { echo "::error::CSV 为空"; exit 1; }
          lines=$(wc -l < /tmp/wave.csv)
          [ "$lines" -eq 1025 ] || { echo "::error::CSV 行数应为 1025，实际 $lines"; exit 1; }
          head -1 /tmp/wave.csv | grep -q 'Time(s)' || { echo "::error::CSV 表头错误"; exit 1; }
          echo "✓ 端到端采集产出 1024 点"

      - name: I2C 场景双通道
        run: |
          cargo run -q -p scope-cli -- sim capture --scenario i2c_100k -n 2048 -o /tmp/i2c.csv
          test -s /tmp/i2c.csv || { echo "::error::I2C CSV 为空"; exit 1; }
          head -1 /tmp/i2c.csv | grep -q 'CH2V' || { echo "::error::应为双通道"; exit 1; }
          echo "✓ I2C 双通道采集成功"

      - name: CLI 测量命令
        run: |
          out=$(cargo run -q -p scope-cli -- sim measure --scenario sine_1k_3v3 -n 4096)
          echo "$out"
          echo "$out" | grep -q 'Vpp=' || { echo "::error::测量未输出 Vpp"; exit 1; }
          # 4096 点 @857 kSPS = 4.78 ms，覆盖约 4.8 个 1 kHz 周期 —— 频率必须测得出。
          # （1024 点只有 1.19 ms，不足一个完整周期，频率会报「测不出」，那是正确行为，
          #   所以这条特意用 4096 点，否则测不出与测量坏了分不开。）
          echo "$out" | grep -q '频率=1000' || { echo "::error::1 kHz 正弦的频率测量不对"; exit 1; }
          echo "✓ CLI 测量输出 Vpp 与正确的频率"

      - name: MCP 自检
        run: cargo run -q -p scope-mcp -- --selftest

      # docs/05-roadmap.md 的「MCP 工具清单」是 TOOLS 常量的**人读镜像**，
      # 文档自己写着「改一处必须改两处」—— 但在此之前没有任何东西守着它。
      # 这跟协议那四处用的是同一种纪律：镜像会腐烂，所以让 CI 盯着。
      - name: 检查 MCP 工具名清单与实现一致
        working-directory: .
        run: |
          cargo run -q --manifest-path host/Cargo.toml -p scope-mcp -- --list-tools \
            | grep -oP '^── \Kscope_[a-z_]+' | sort -u > /tmp/impl_tools.txt
          grep -oP '^\| `\Kscope_[a-z_]+' docs/05-roadmap.md | sort -u > /tmp/doc_tools.txt
          echo "实现 $(wc -l < /tmp/impl_tools.txt) 个 / 文档 $(wc -l < /tmp/doc_tools.txt) 个"
          if ! diff -u /tmp/doc_tools.txt /tmp/impl_tools.txt; then
            echo "::error::docs/05-roadmap.md 的工具清单与 scope-mcp 的 TOOLS 常量不一致"
            exit 1
          fi
          echo "✓ 工具名清单一致（说明文字仍需人工同步）"
