[workspace]
resolver = "2"
members = [
    "crates/proto",
    "crates/core",
    "crates/transport-serial",
    "crates/sim",
    "crates/cli",
    "crates/mcp",
    "crates/gui",
]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
rust-version = "1.75"
license      = "GPL-3.0"
repository   = "https://github.com/OWNER/i2c-scope-f103"
authors      = ["F103 Agent Scope Team"]

[workspace.dependencies]
scope-proto            = { path = "crates/proto" }
scope-core             = { path = "crates/core" }
scope-transport-serial = { path = "crates/transport-serial" }
scope-sim              = { path = "crates/sim" }

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = { version = "2" }
anyhow      = "1"

# GUI。渲染后端是 feature 开关（egui-wgpu / egui_glow 在 crate 元数据里都是
# optional，只有 winit 是必需的），所以这里显式写死默认特性、不依赖隐式默认值。
eframe      = "0.36.2"
egui        = "0.36.2"
egui_plot   = "0.37.0"

[profile.release]
lto       = true
codegen-units = 1

[profile.dev]
opt-level = 1

# 模拟器波形合成本身是热路径，跑 test 时也要够快
[profile.dev.package."*"]
opt-level = 2
